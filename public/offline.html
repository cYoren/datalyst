<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Datalyst</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #14b8a6;
          --accent-fg: #022c22;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.75rem; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Datalyst needs a connection to load your data. Your saved check-ins are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
