<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datalyst</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #020617; color: #e2e8f0; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      a, button { color: #38bdf8; }
      button { border: 1px solid #38bdf8; border-radius: 0.5rem; background: transparent; padding: 0.7rem 1rem; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Datalyst</h1>
      <p id="status">Opening Datalyst...</p>
      <p><a id="open" href="https://www.datalyst.one/dashboard">Open Datalyst</a></p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>
      const target = "https://www.datalyst.one/dashboard";
      const status = document.getElementById("status");
      async function openDatalyst() {
        status.textContent = "Opening Datalyst...";
        try {
          await fetch(target, { mode: "cors", cache: "no-store" });
          window.location.replace(target);
        } catch (_) {
          status.textContent = "Datalyst is not reachable right now. Check your connection and retry.";
        }
      }
      document.getElementById("retry").addEventListener("click", openDatalyst);
      openDatalyst();
    </script>
  </body>
</html>
