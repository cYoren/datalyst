name: Android bundle validation (upload opt-in)

on:
  workflow_dispatch:
    inputs:
      upload_to_store:
        description: Explicitly authorize uploading the signed bundle to production.
        type: boolean
        required: true
        default: false
      store_build_numbers_verified:
        description: Both stores were checked and the synchronized version/build is unused.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-upload:
    name: Build Android bundle; upload only when explicitly enabled
    runs-on: [self-hosted, macOS, ARM64, macos-15, datalyst-release]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require verified store numbers for a requested upload
        if: ${{ inputs.upload_to_store && !inputs.store_build_numbers_verified }}
        run: |
          echo 'Upload blocked: verify current version/build numbers in both stores first.' >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Install dependencies and sync native shell
        run: |
          set -euo pipefail
          npm ci
          node scripts/native-preflight.mjs
          npx cap sync android
      - name: Install Android signing assets
        if: ${{ inputs.upload_to_store && inputs.store_build_numbers_verified }}
        run: |
          set -euo pipefail
          cp "$HOME/Documents/Coding/Datalyst/android/key.properties" android/key.properties
          cp "$HOME/Documents/Coding/Datalyst/android/app/release-keystore.jks" android/app/release-keystore.jks
      - name: Build signed Android App Bundle
        if: ${{ inputs.upload_to_store && inputs.store_build_numbers_verified }}
        working-directory: android
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon bundleRelease -PdatalystStoreBuildVerified=true
      - name: Build unsigned Android App Bundle
        if: ${{ !inputs.upload_to_store }}
        working-directory: android
        run: bash ./gradlew --no-daemon bundleRelease -PdatalystUnsignedRelease=true
      - name: Save validation bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalyst-android-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload production bundle
        if: ${{ inputs.upload_to_store && inputs.store_build_numbers_verified }}
        run: |
          set -euo pipefail
          fastlane supply \
            --package_name com.datalyst.app \
            --track production \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --json_key "$HOME/Documents/Coding/.fastlane/google-play-key.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
